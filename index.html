<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Juggle 3 to 7 balls with real gravity. Free browser game.">
<title>Juggle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one tall stage under a spotlight, ball-count strip above, two big hand buttons below. Single night-stage look on purpose. */
:root{
  --bg:#121b24; --panel:#1d2a35; --panel2:#273846; --ink:#f3efe4; --muted:#9fb0bb; --line:#33475a;
  --accent:#f2b84b; --good:#8fd47a; --bad:#f07a6b;
  --f-display:"Fredoka","Avenir Next Rounded",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 32px;display:grid;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;letter-spacing:-.01em}
#levelInfo{font-family:var(--f-display);font-weight:500;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.levels{display:flex;gap:6px;flex-wrap:wrap}
button{font-family:var(--f-display);font-size:16px;font-weight:600;border:0;border-radius:10px;padding:9px 14px;background:var(--panel2);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #0b1117;transition:transform .06s}
button:hover:not(:disabled){filter:brightness(1.12)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0b1117}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#2a2008}
.lv{width:48px;padding:5px 0 4px;display:grid;justify-items:center;line-height:1.1}
.lv b{font-size:17px}.lv small{font-size:10px;letter-spacing:1px;color:var(--accent)}
.lv.cur{background:var(--accent);color:#2a2008}.lv.cur small{color:#2a2008}
.stage{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#0f1820}
canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.hands{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.hand{font-size:20px;padding:16px 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.hand kbd,.res kbd{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-left:6px}
.res .primary kbd{color:#5a4510}
.mid{display:flex;gap:6px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,15,20,.55);padding:16px}
.res{background:var(--panel);border:2px solid var(--line);padding:20px 26px;border-radius:16px;text-align:center;display:grid;gap:10px;min-width:min(300px,100%)}
.res h2{font-family:var(--f-display);font-size:28px;margin:0}
.res h2.good{color:var(--good)}.res h2.bad{color:var(--bad)}
.big{font-family:var(--f-display);font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.res p{margin:0;color:var(--muted)}
#resultRhythm{font-family:var(--f-display);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
#resultRhythm b{color:var(--accent)}
.stars{display:flex;justify-content:center;gap:8px}
.stars span{font-size:40px;line-height:1;color:var(--line)}
.stars span.on{color:var(--accent);animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards}
.res .row{display:flex;gap:8px;justify-content:center}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.stars span.on{animation:none}}
@media (max-width:520px){h1{font-size:24px}.hand{font-size:18px;padding:14px 6px}
  /* the stage is short on a phone: keep the whole result card, buttons included, inside it */
  .overlay{padding:6px}.res{padding:8px 14px;gap:3px}.res h2{font-size:20px}.big{font-size:32px}
  .res p{font-size:12px}.stars span{font-size:24px}.res button{padding:6px 12px;font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title"><h1>Juggle</h1><span id="levelInfo"></span></div>
    <div class="levels" id="levels"></div>
  </div>
  <div class="stage">
    <canvas id="stage" width="800" height="600" aria-label="Juggling stage. Two robot arms throw with the left and right keys."></canvas>
    <div class="overlay" id="result" hidden>
      <div class="res">
        <h2 id="resultTitle">Dropped</h2>
        <div class="big" id="resultCatches">0</div>
        <p id="resultSub"></p>
        <p id="resultRhythm"></p>
        <div class="stars" id="resultStars"></div>
        <div class="row"><button class="primary" id="resultAgain">Again<kbd>F J</kbd></button><button id="resultNext">Next</button></div>
      </div>
    </div>
  </div>
  <div class="hands">
    <button class="hand" id="leftHandButton">Left<kbd>F</kbd></button>
    <div class="mid"><button id="muteButton" aria-label="Sound on">Sound on</button></div>
    <button class="hand" id="rightHandButton">Right<kbd>J</kbd></button>
  </div>
</div>

<script id="sim">
/* =====================================================================
   0. SETTINGS
   Every number that shapes play or meaning lives here, so it can be
   tuned in one place. Physics is in SI units (metres, seconds), with the
   hands at height 0.
   ===================================================================== */
const SETTINGS={
  // --- physics ---
  gravity:9.81,
  handInnerX:0.10,               // how far from the centre a hand carries a ball before throwing
  handOuterX:0.30,               // how far from the centre a hand rests and catches
  floorY:-1.0,                   // floor height (the hands are at 0)
  ballRadius:0.06,
  airtimeSeconds:0.72,           // every level throws to the 3-ball height; more balls only shorten the beat
  ballCounts:[3,4,5,6,7],        // one level per entry; odd = cascade (hand to hand), even = fountain (same hand)

  // --- forgiveness ---
  holdingTwoGraceSeconds:0.12,   // a hand holding two balls must throw one within this, or one falls
  flailSeconds:0.22,             // pressing an empty hand makes it flail this long; a ball landing then falls
  earlyPressSeconds:0.15,        // pressing an empty hand this close before its catch queues the throw instead
  minimumHoldBeats:0.3,          // a queued throw leaves no sooner than this share of a beat after its catch

  // --- scoring ---
  starCatchesPerBall:[1,2,5],    // star k needs this many catches per ball; the 2nd star unlocks the next level
  starNames:['Flash','Qualified','Run'],
  // a throw is graded by how far its hold was from one beat: within perfect -> Perfect, within good -> Good
  perfectWindow:{beats:0.15,minimumSeconds:0.03},
  goodWindow:{beats:0.35,minimumSeconds:0.07},
  grades:[['Perfect','#8fd47a'],['Good','#f3efe4'],['Early','#f2b84b'],['Late','#f2b84b']],

  // --- timing of the run ---
  simulationStepSeconds:1/240,
  longestFrameSeconds:0.05,      // a slow frame never advances the juggle by more than this
  resultDelaySeconds:1.1,        // after a drop, wait this long before the result card
  restartLockSeconds:0.4,        // F/J on the result card only restart after this, so a late mash is not a retry

  // --- look and feel ---
  ballColors:['#ec4a40','#f3c63c','#3f8fe0','#4bb56d','#f28a3a','#a06ddb','#f1eee6'],
  smallestBallPixels:12,
  trailLength:9,                 // remembered positions per ball in the air
  gradePopSeconds:0.7,
  catchRingSeconds:0.3,
  dropFlashSeconds:0.35,
  dropShakePixels:9,
  dropShakeSeconds:0.3,
  bannerSeconds:1.4,             // star banner ("Qualified!") on screen
  armUpperLength:0.34, armLowerLength:0.30, shoulder:[0.42,-0.45],
  colors:{ink:'#f3efe4',muted:'#9fb0bb',line:'#33475a',accent:'#f2b84b',good:'#8fd47a',bad:'#f07a6b',outline:'#0b1117'},
};

/* =====================================================================
   1. JUGGLING SIMULATION
   Pure physics, no drawing, so it also runs under node for tests.
   A throw always flies for one airtime, so the player's press timing
   alone decides when balls land. The beat is the time between throws
   (alternating hands); a hand holds each ball for one beat, so the
   airtime is (balls - 1) beats and the apex is gravity * airtime^2 / 8.
   ===================================================================== */
const sideSign=hand=>hand===0?-1:1;   // hand 0 is left (negative x)
const LEVELS=SETTINGS.ballCounts.map(balls=>{
  const airtime=SETTINGS.airtimeSeconds,beat=airtime/(balls-1);
  return {balls,beat,airtime,holdSeconds:beat,minimumHoldSeconds:SETTINGS.minimumHoldBeats*beat,apex:SETTINGS.gravity*airtime*airtime/8};
});

/* A fresh world: the left hand starts with the larger half of the balls. */
function makeWorld(level){
  const hands=[0,1].map(index=>({index,x:sideSign(index)*SETTINGS.handOuterX,y:0,balls:[],flailUntil:-1,queued:false,dropDeadline:null}));
  const balls=[];
  for(let id=0;id<level.balls;id++){
    const hand=id<Math.ceil(level.balls/2)?0:1,ball={id,state:'held',hand,caughtAt:-9,x:0,y:0,vx:0,vy:0};
    balls.push(ball);hands[hand].balls.push(ball);
  }
  const world={level,time:0,hands,balls,catches:0,droppedAt:null,lastThrow:null,events:[]};
  placeHeldBalls(world);return world;
}

/* The ball in the air that lands in this hand soonest, or null. */
function nextIncomingBall(world,hand){
  let soonest=null;
  for(const ball of world.balls)if(ball.state==='air'&&ball.toHand===hand&&(!soonest||ball.thrownAt+ball.airtime<soonest.thrownAt+soonest.airtime))soonest=ball;
  return soonest;
}

/* Launch the oldest ball in this hand on a parabola that lands in the target hand after one airtime. */
function throwBall(world,hand){
  const handState=world.hands[hand],ball=handState.balls.shift(),level=world.level;
  const toHand=level.balls%2?1-hand:hand,airtime=level.airtime,targetX=sideSign(toHand)*SETTINGS.handOuterX;
  const holdDeviation=ball.caughtAt<0?null:world.time-ball.caughtAt-level.holdSeconds;   // null for a ball never caught yet
  Object.assign(ball,{state:'air',toHand,thrownAt:world.time,airtime,x0:handState.x,y0:handState.y,x:handState.x,y:handState.y,
    vx:(targetX-handState.x)/airtime,vy:(SETTINGS.gravity*airtime*airtime/2-handState.y)/airtime});
  handState.queued=false;
  if(handState.balls.length<=1)handState.dropDeadline=null;
  world.lastThrow={hand,time:world.time};
  world.events.push({type:'throw',hand,holdDeviation});
}

/* The player pressed a hand: throw, queue a throw, or flail at nothing. */
function press(world,hand){
  if(world.droppedAt!==null)return;
  const handState=world.hands[hand];
  if(handState.balls.length){
    if(world.time-handState.balls[0].caughtAt>=world.level.minimumHoldSeconds)throwBall(world,hand);else handState.queued=true;
    return;
  }
  const incoming=nextIncomingBall(world,hand);
  if(incoming&&incoming.thrownAt+incoming.airtime-world.time<SETTINGS.earlyPressSeconds){handState.queued=true;return;}
  handState.flailUntil=world.time+SETTINGS.flailSeconds;
  world.events.push({type:'flail',hand});
}

/* A ball falls. The first fall ends the run; cause is 'early' (flailed) or 'late' (held two too long). */
function dropBall(world,ball,vx,hand,cause){
  Object.assign(ball,{state:'drop',vx,vy:1.2});
  if(world.droppedAt===null){world.droppedAt=world.time;world.events.push({type:'drop',hand,cause});}
}

/* Advance the world by one fixed step. */
function step(world,seconds){
  world.time+=seconds;const level=world.level;
  for(const handState of world.hands){
    const side=sideSign(handState.index);
    if(handState.balls.length){   // carry the held ball inward and dip, then back out to throw
      const progress=Math.min(1,Math.max(0,(world.time-handState.balls[0].caughtAt)/level.holdSeconds));
      handState.x=side*(SETTINGS.handOuterX+(SETTINGS.handInnerX-SETTINGS.handOuterX)*progress);
      handState.y=-0.07*Math.sin(Math.PI*progress);
    }else{                         // empty: ease back to the catch spot
      const ease=1-Math.exp(-14*seconds);
      handState.x+=(side*SETTINGS.handOuterX-handState.x)*ease;handState.y+=(0-handState.y)*ease;
    }
    if(handState.flailUntil>world.time)handState.y+=0.06*Math.sin((handState.flailUntil-world.time)/SETTINGS.flailSeconds*Math.PI);
    if(handState.queued&&handState.balls.length&&world.time-handState.balls[0].caughtAt>=level.minimumHoldSeconds&&world.droppedAt===null)throwBall(world,handState.index);
    if(handState.dropDeadline!==null&&world.time>=handState.dropDeadline){
      handState.dropDeadline=null;
      if(handState.balls.length>1)dropBall(world,handState.balls.pop(),side*0.8,handState.index,'late');
    }
  }
  for(const ball of world.balls){
    if(ball.state==='air'){
      const flown=world.time-ball.thrownAt;
      if(flown>=ball.airtime){
        const handState=world.hands[ball.toHand];
        if(handState.flailUntil>world.time){dropBall(world,ball,sideSign(ball.toHand)*1.4,ball.toHand,'early');continue;}
        ball.state='held';ball.hand=ball.toHand;ball.caughtAt=world.time;handState.balls.push(ball);
        if(world.droppedAt===null){world.catches++;world.events.push({type:'catch',hand:ball.toHand});}
        if(handState.balls.length>1&&handState.dropDeadline===null)handState.dropDeadline=world.time+SETTINGS.holdingTwoGraceSeconds;
      }else{ball.x=ball.x0+ball.vx*flown;ball.y=ball.y0+ball.vy*flown-SETTINGS.gravity*flown*flown/2;}
    }else if(ball.state==='drop'){   // free fall with a few damped bounces on the floor
      ball.vy-=SETTINGS.gravity*seconds;ball.x+=ball.vx*seconds;ball.y+=ball.vy*seconds;
      if(ball.y<SETTINGS.floorY+SETTINGS.ballRadius){ball.y=SETTINGS.floorY+SETTINGS.ballRadius;ball.vy=Math.abs(ball.vy)>.4?-ball.vy*.45:0;ball.vx*=.8;}
    }
  }
  placeHeldBalls(world);
}

/* Held balls sit stacked in their hand's cup. */
function placeHeldBalls(world){
  for(const handState of world.hands)handState.balls.forEach((ball,stackIndex)=>{
    ball.x=handState.x+sideSign(handState.index)*stackIndex*0.09;ball.y=handState.y+SETTINGS.ballRadius+stackIndex*0.05;
  });
}
if(typeof module!=='undefined')module.exports={SETTINGS,LEVELS,makeWorld,step,press};
</script>

<script>
/* =====================================================================
   2. STATE AND SAVE
   ===================================================================== */
const $=selector=>document.querySelector(selector);
const canvas=$('#stage'),ctx=canvas.getContext('2d'),WIDTH=800,HEIGHT=600,PIXEL_RATIO=Math.min(2,window.devicePixelRatio||1);
canvas.width=WIDTH*PIXEL_RATIO;canvas.height=HEIGHT*PIXEL_RATIO;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COLORS=SETTINGS.colors;

let levelIndex=0,world,mode='ready';   // mode: 'ready' (before the first throw), 'play', 'over'
let stepBacklog=0,overSince=0;
// visual effects, all in seconds of page time
let gradePops=[],catchRings=[],trails=[],banner=null,shownCatches=0,catchBumpAt=0,dropAt=-9,rhythmCounts=null;

let save={best:{},unlocked:1,muted:false};
try{save=Object.assign(save,JSON.parse(localStorage.getItem('juggle-save')||'{}'));}catch(error){}
function persist(){try{localStorage.setItem('juggle-save',JSON.stringify(save));}catch(error){}}

const starMarks=level=>SETTINGS.starCatchesPerBall.map(perBall=>perBall*level.balls);

/* Grade index into SETTINGS.grades: 0 Perfect, 1 Good, 2 Early, 3 Late. */
function gradeThrow(deviation,beat){
  const size=Math.abs(deviation),{perfectWindow,goodWindow}=SETTINGS;
  if(size<Math.max(perfectWindow.minimumSeconds,perfectWindow.beats*beat))return 0;
  if(size<Math.max(goodWindow.minimumSeconds,goodWindow.beats*beat))return 1;
  return deviation<0?2:3;
}

/* =====================================================================
   3. SOUND: a tiny synth that starts on the first input
   ===================================================================== */
let audio=null;
function tone(frequency,duration,type='sine',volume=.18,slide=0){
  if(save.muted)return;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const oscillator=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;
    oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,now);
    if(slide)oscillator.frequency.exponentialRampToValueAtTime(frequency*slide,now+duration);
    gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);
    oscillator.connect(gain).connect(audio.destination);oscillator.start(now);oscillator.stop(now+duration);
  }catch(error){}
}
function updateMuteButton(){const label=save.muted?'Sound off':'Sound on';$('#muteButton').textContent=label;$('#muteButton').setAttribute('aria-label',label);}
$('#muteButton').onclick=()=>{save.muted=!save.muted;persist();updateMuteButton();};

/* =====================================================================
   4. LEVELS AND RESULTS
   ===================================================================== */
function buildLevelButtons(){
  const strip=$('#levels');strip.innerHTML='';
  LEVELS.forEach((level,index)=>{
    const button=document.createElement('button'),best=save.best[index]||0,stars=starMarks(level).filter(mark=>best>=mark).length;
    button.className='lv'+(index===levelIndex?' cur':'');button.disabled=index>=save.unlocked;
    button.innerHTML=`<b>${level.balls}</b><small>${index<save.unlocked?'★'.repeat(stars)+'·'.repeat(3-stars):'locked'}</small>`;
    button.title=`${level.balls} balls`;button.onclick=()=>loadLevel(index);strip.appendChild(button);
  });
}
function loadLevel(index){
  levelIndex=index;const level=LEVELS[index];
  $('#levelInfo').textContent=`${level.balls} balls · ${level.beat.toFixed(2)} s beat · apex ${(level.apex+1).toFixed(1)} m`;
  resetRun();buildLevelButtons();
}
function resetRun(){
  world=makeWorld(LEVELS[levelIndex]);mode='ready';stepBacklog=0;
  gradePops=[];catchRings=[];banner=null;shownCatches=0;trails=world.balls.map(()=>[]);dropAt=-9;rhythmCounts=[0,0,0,0];
  $('#result').hidden=true;
}
/* Show the result card: title says what happened (qualified, new best, or why the ball fell). */
function endRun(){
  mode='over';overSince=performance.now()/1000;
  const level=LEVELS[levelIndex],catches=world.catches,previousBest=save.best[levelIndex]||0,marks=starMarks(level);
  if(catches>previousBest)save.best[levelIndex]=catches;
  if(catches>=marks[1]&&save.unlocked<LEVELS.length&&save.unlocked<=levelIndex+1)save.unlocked=levelIndex+2;
  persist();buildLevelButtons();
  const stars=marks.filter(mark=>catches>=mark).length,qualifiedNow=catches>=marks[1]&&previousBest<marks[1],newBest=catches>previousBest&&previousBest>0;
  const cause=world.dropCause==='early'?'Too early':'Too late';
  const title=$('#resultTitle');
  title.textContent=qualifiedNow?'Qualified!':newBest?'New best!':cause;
  title.className=qualifiedNow||newBest?'good':'bad';
  $('#resultCatches').textContent=catches;
  $('#resultSub').textContent=`catches · best ${Math.max(previousBest,catches)} · qualify at ${marks[1]}`;
  $('#resultStars').innerHTML=marks.map((mark,k)=>`<span class="${k<stars?'on':''}" title="${SETTINGS.starNames[k]}: ${mark}" style="animation-delay:${.15+k*.18}s">★</span>`).join('');
  const graded=rhythmCounts.reduce((sum,count)=>sum+count,0);
  $('#resultRhythm').innerHTML=graded?`Rhythm <b>${Math.round(100*rhythmCounts[0]/graded)}%</b> perfect · ${rhythmCounts[2]} early · ${rhythmCounts[3]} late`:'';
  $('#resultNext').hidden=!(levelIndex+1<save.unlocked);
  $('#result').hidden=false;
}

/* =====================================================================
   5. INPUT: F/J (and neighbours), tap either half of the stage, or the
   two hand buttons. On the result card a hand key starts the next try.
   ===================================================================== */
const HAND_KEYS={f:0,a:0,d:0,s:0,arrowleft:0,j:1,k:1,l:1,';':1,arrowright:1};
function pressHand(hand){
  if(mode==='over'){if(performance.now()/1000-overSince>SETTINGS.restartLockSeconds)resetRun();return;}
  if(mode==='ready')mode='play';
  press(world,hand);
}
addEventListener('keydown',event=>{
  if(event.repeat||event.metaKey||event.ctrlKey||event.altKey)return;
  const key=event.key.toLowerCase();
  if(key in HAND_KEYS){event.preventDefault();pressHand(HAND_KEYS[key]);}
  else if(key===' '||key==='enter'||key==='r'){if(mode==='over'||key==='r'){event.preventDefault();resetRun();}}
});
canvas.addEventListener('pointerdown',event=>{const box=canvas.getBoundingClientRect();pressHand(event.clientX-box.left<box.width/2?0:1);});
for(const [id,hand] of [['#leftHandButton',0],['#rightHandButton',1]])$(id).addEventListener('pointerdown',event=>{event.preventDefault();pressHand(hand);});
$('#resultAgain').onclick=resetRun;$('#resultNext').onclick=()=>loadLevel(levelIndex+1);

/* =====================================================================
   6. DRAWING
   World metres map to canvas pixels through camera(): x right, y up,
   scaled so the apex of the current level fits under the counter.
   ===================================================================== */
function camera(){const level=LEVELS[levelIndex],scale=(HEIGHT-56)/(level.apex+1.0+0.42);return {scale,originX:WIDTH/2,originY:HEIGHT-24-1.0*scale};}
function ballPixels(view){return Math.max(SETTINGS.ballRadius*view.scale,SETTINGS.smallestBallPixels);}
function handPixel(view,hand){return [view.originX+sideSign(hand)*SETTINGS.handOuterX*view.scale,view.originY];}

/* Shoulder and elbow for an arm reaching the hand point (two-link inverse kinematics, elbow outward). */
function armJoints(side,handX,handY){
  const upper=SETTINGS.armUpperLength,lower=SETTINGS.armLowerLength,shoulder=[side*SETTINGS.shoulder[0],SETTINGS.shoulder[1]];
  const dx=handX-shoulder[0],dy=handY-shoulder[1],reach=Math.min(upper+lower-1e-3,Math.hypot(dx,dy)),angle=Math.atan2(dy,dx);
  const bend=Math.acos(Math.max(-1,Math.min(1,(upper*upper+reach*reach-lower*lower)/(2*upper*reach))));
  const elbowA=[shoulder[0]+upper*Math.cos(angle+bend),shoulder[1]+upper*Math.sin(angle+bend)],elbowB=[shoulder[0]+upper*Math.cos(angle-bend),shoulder[1]+upper*Math.sin(angle-bend)];
  return [shoulder,side*elbowA[0]>side*elbowB[0]?elbowA:elbowB];
}
function drawLink(toPixel,from,to,width,color){
  ctx.lineCap='round';
  for(const [lineWidth,stroke] of [[width+4,COLORS.outline],[width,color]]){ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth;ctx.beginPath();ctx.moveTo(...toPixel(...from));ctx.lineTo(...toPixel(...to));ctx.stroke();}
}
function drawJoint(toPixel,point,radius){
  const [x,y]=toPixel(...point);
  for(const [r,fill] of [[radius+2,COLORS.outline],[radius,'#c9d3da'],[radius*.4,'#6d7d89']]){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
}
/* Robot base plus two arms with cup grippers; a cup is red while flailing, gold while holding. */
function drawJuggler(view){
  const toPixel=(x,y)=>[view.originX+x*view.scale,view.originY-y*view.scale],metresToPixels=metres=>Math.max(3,metres*view.scale);
  const [baseX,baseY]=toPixel(-.55,-.40),baseWidth=1.1*view.scale,baseHeight=(SETTINGS.floorY+.40)*-view.scale;
  ctx.fillStyle=COLORS.outline;ctx.beginPath();ctx.roundRect(baseX-2,baseY-2,baseWidth+4,baseHeight+4,metresToPixels(.06));ctx.fill();
  ctx.fillStyle='#3a4c5c';ctx.beginPath();ctx.roundRect(baseX,baseY,baseWidth,baseHeight,metresToPixels(.05));ctx.fill();
  ctx.fillStyle='#2c3b48';ctx.fillRect(baseX+metresToPixels(.06),baseY+baseHeight*.55,baseWidth-metresToPixels(.12),metresToPixels(.05));
  ctx.fillStyle=world.droppedAt===null?COLORS.good:COLORS.bad;ctx.beginPath();ctx.arc(view.originX,baseY+metresToPixels(.12),metresToPixels(.035),0,7);ctx.fill();
  for(const handState of world.hands){
    const side=sideSign(handState.index),handPoint=[handState.x,handState.y-.03],[shoulder,elbow]=armJoints(side,...handPoint);
    drawLink(toPixel,shoulder,elbow,metresToPixels(.075),'#9aa9b4');drawLink(toPixel,elbow,handPoint,metresToPixels(.06),'#b8c4cc');
    drawJoint(toPixel,shoulder,metresToPixels(.05));drawJoint(toPixel,elbow,metresToPixels(.04));
    const [cupX,cupY]=toPixel(...handPoint),cupRadius=Math.max(ballPixels(view)+3,metresToPixels(.07));
    ctx.fillStyle=COLORS.outline;ctx.beginPath();ctx.arc(cupX,cupY,cupRadius+3,0,Math.PI);ctx.fill();
    ctx.fillStyle=handState.flailUntil>world.time?COLORS.bad:handState.balls.length?COLORS.accent:'#7f8f9b';ctx.beginPath();ctx.arc(cupX,cupY,cupRadius,0,Math.PI);ctx.fill();
    ctx.fillStyle=COLORS.outline;ctx.fillRect(cupX-cupRadius-3,cupY-2,2*cupRadius+6,4);
  }
}
function drawBall(x,y,radius,color){
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(x+radius*.15,y+radius*.2,radius,0,7);ctx.fill();
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,radius,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x-radius*.35,y-radius*.35,radius*.35,0,7);ctx.fill();
}
function drawText(string,x,y,size,color,weight=700,align='center'){
  ctx.font=`${weight} ${size}px Fredoka, system-ui, sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,size/7);ctx.strokeStyle='rgba(8,12,16,.7)';ctx.strokeText(string,x,y);ctx.fillStyle=color;ctx.fillText(string,x,y);
}
/* Throw cue: a ring round the ball the next hand should throw fills over one beat, and turns green in the Perfect window. */
function drawThrowCue(view,level,now){
  let hand,progress,inPerfectWindow=false;
  if(mode==='ready'){hand=0;progress=.5+.5*Math.sin(now*6);}
  else if(mode==='play'&&world.droppedAt===null&&world.lastThrow){
    hand=1-world.lastThrow.hand;
    const sinceThrow=world.time-world.lastThrow.time;
    progress=Math.min(1,sinceThrow/level.beat);
    inPerfectWindow=gradeThrow(sinceThrow-level.beat,level.beat)===0;
  }else return;
  const ball=world.hands[hand].balls[0];
  if(!ball)return;   // nothing to throw yet
  const x=view.originX+ball.x*view.scale,y=view.originY-ball.y*view.scale,radius=ballPixels(view)+7;
  ctx.lineCap='round';ctx.lineWidth=4;
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(x,y,radius,0,7);ctx.stroke();
  ctx.strokeStyle=inPerfectWindow?COLORS.good:COLORS.accent;ctx.globalAlpha=.5+.5*progress;
  ctx.beginPath();ctx.arc(x,y,radius,-Math.PI/2,-Math.PI/2+2*Math.PI*progress);ctx.stroke();ctx.globalAlpha=1;
}
function render(nowMs){
  const now=nowMs/1000,view=camera(),level=LEVELS[levelIndex];
  ctx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0);
  ctx.fillStyle='#0f1820';ctx.fillRect(0,0,WIDTH,HEIGHT);
  const shake=reducedMotion?0:SETTINGS.dropShakePixels*Math.max(0,1-(now-dropAt)/SETTINGS.dropShakeSeconds);
  if(shake)ctx.translate((Math.random()-.5)*2*shake,(Math.random()-.5)*2*shake);
  const spotlight=ctx.createRadialGradient(WIDTH/2,view.originY,10,WIDTH/2,view.originY,HEIGHT*.95);
  spotlight.addColorStop(0,'rgba(243,226,180,.20)');spotlight.addColorStop(1,'rgba(243,226,180,0)');ctx.fillStyle=spotlight;ctx.fillRect(-20,-20,WIDTH+40,HEIGHT+40);
  const floorPixel=view.originY-SETTINGS.floorY*view.scale;
  ctx.fillStyle='#2a241d';ctx.fillRect(-20,floorPixel,WIDTH+40,HEIGHT-floorPixel+20);ctx.fillStyle='#3a3127';ctx.fillRect(-20,floorPixel,WIDTH+40,3);
  // height ruler from the floor, in metres, and the apex line
  ctx.strokeStyle=COLORS.line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(WIDTH-44,floorPixel);ctx.lineTo(WIDTH-44,20);ctx.stroke();
  for(let metre=0;metre<=Math.floor(level.apex+1.2);metre++){
    const y=floorPixel-metre*view.scale;if(y<20)break;
    ctx.beginPath();ctx.moveTo(WIDTH-52,y);ctx.lineTo(WIDTH-36,y);ctx.stroke();drawText(`${metre} m`,WIDTH-58,y,13,COLORS.muted,600,'right');
  }
  const apexPixel=view.originY-level.apex*view.scale;
  ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(242,184,75,.35)';ctx.beginPath();ctx.moveTo(60,apexPixel);ctx.lineTo(WIDTH-60,apexPixel);ctx.stroke();ctx.setLineDash([]);
  drawText(`apex ${(level.apex+1).toFixed(2)} m`,64,apexPixel-12,13,COLORS.accent,600,'left');
  drawJuggler(view);
  // catch cue: a ring in the ball's colour closes onto the hand as the next ball arrives
  for(const handState of world.hands){
    const incoming=world.droppedAt===null?nextIncomingBall(world,handState.index):null;if(!incoming)continue;
    const secondsLeft=incoming.thrownAt+incoming.airtime-world.time,closing=Math.max(0,Math.min(1,secondsLeft/(level.beat*2))),[x,y]=handPixel(view,handState.index);
    ctx.strokeStyle=SETTINGS.ballColors[incoming.id];ctx.globalAlpha=.25+.6*(1-closing);ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,ballPixels(view)+4+30*closing,0,7);ctx.stroke();ctx.globalAlpha=1;
  }
  const radius=ballPixels(view);
  if(!reducedMotion)world.balls.forEach((ball,index)=>{
    const trail=trails[index];
    for(let k=1;k<trail.length;k++){ctx.globalAlpha=.22*k/trail.length;ctx.fillStyle=SETTINGS.ballColors[ball.id];ctx.beginPath();ctx.arc(view.originX+trail[k][0]*view.scale,view.originY-trail[k][1]*view.scale,radius*(.45+.45*k/trail.length),0,7);ctx.fill();}
    ctx.globalAlpha=1;
  });
  for(const ring of catchRings){const age=(now-ring.at)/SETTINGS.catchRingSeconds;if(age>1)continue;ctx.strokeStyle=ring.color;ctx.globalAlpha=1-age;ctx.lineWidth=3;ctx.beginPath();ctx.arc(ring.x,ring.y,radius+4+age*22,0,7);ctx.stroke();ctx.globalAlpha=1;}
  for(const ball of world.balls)drawBall(view.originX+ball.x*view.scale,view.originY-ball.y*view.scale,radius,SETTINGS.ballColors[ball.id]);
  drawThrowCue(view,level,now);
  for(const handState of world.hands)if(handState.flailUntil>world.time)drawText('!',view.originX+handState.x*view.scale,view.originY-handState.y*view.scale-28,22,COLORS.bad);
  for(const pop of gradePops){const age=(now-pop.at)/SETTINGS.gradePopSeconds;if(age>1)continue;ctx.globalAlpha=Math.min(1,(1-age)*2.5);drawText(pop.text,pop.x,pop.y-20-age*26,pop.size,pop.color,700);ctx.globalAlpha=1;}
  if(now-dropAt<SETTINGS.dropFlashSeconds){ctx.fillStyle=`rgba(240,122,107,${.22*(1-(now-dropAt)/SETTINGS.dropFlashSeconds)})`;ctx.fillRect(-20,-20,WIDTH+40,HEIGHT+40);}
  ctx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0);
  // catch counter with a bump on every catch, best below, star marks top left
  if(world.catches!==shownCatches){shownCatches=world.catches;catchBumpAt=now;}
  const bump=reducedMotion?1:1+.25*Math.max(0,1-(now-catchBumpAt)/.18);
  ctx.save();ctx.translate(WIDTH/2,56);ctx.scale(bump,bump);drawText(String(world.catches),0,0,56,COLORS.ink);ctx.restore();
  const marks=starMarks(level),best=save.best[levelIndex]||0;
  drawText(`best ${best}`,WIDTH/2,96,15,COLORS.muted,600);
  marks.forEach((mark,k)=>{const reached=world.catches>=mark,x=36+k*58;drawText('★',x,30,26,reached?COLORS.accent:COLORS.line);drawText(String(mark),x,56,13,reached?COLORS.accent:COLORS.muted,600);});
  if(banner&&now-banner.at<SETTINGS.bannerSeconds){
    const age=now-banner.at,scale=reducedMotion?1:(age<.2?age/.2*1.2:1.2-.2*Math.min(1,(age-.2)/.2));
    ctx.save();ctx.globalAlpha=Math.min(1,(SETTINGS.bannerSeconds-age)/.3);ctx.translate(WIDTH/2,150);ctx.scale(scale,scale);drawText(banner.text,0,0,40,COLORS.accent);ctx.restore();
  }
  if(mode==='ready')drawText('F   ·   J',WIDTH/2,HEIGHT*.3,30,COLORS.ink,600);
}

/* =====================================================================
   7. MAIN LOOP: fixed-step simulation, then turn sim events into
   effects and sounds, then draw.
   ===================================================================== */
function handleEvent(event,now){
  const view=camera(),level=LEVELS[levelIndex],[handX,handY]=handPixel(view,event.hand??0);
  if(event.type==='catch'){
    catchRings.push({x:handX,y:handY,at:now,color:SETTINGS.ballColors[world.hands[event.hand].balls.at(-1)?.id??0]});
    tone(event.hand?660:520,.07,'triangle',.16);
    const markIndex=starMarks(level).indexOf(world.catches);
    if(markIndex>=0){banner={text:SETTINGS.starNames[markIndex]+'!',at:now};[1,1.25,1.5].forEach((ratio,i)=>setTimeout(()=>tone(660*ratio,.18,'sine',.14),i*90));}
  }else if(event.type==='throw'){
    if(event.holdDeviation!==null){
      const grade=gradeThrow(event.holdDeviation,level.beat);rhythmCounts[grade]++;
      gradePops=gradePops.filter(pop=>pop.hand!==event.hand);
      gradePops.push({hand:event.hand,text:SETTINGS.grades[grade][0],color:SETTINGS.grades[grade][1],x:handX,y:handY-ballPixels(view)*2,at:now,size:grade===0?22:18});
    }
    tone(event.hand?300:260,.05,'sine',.05,1.6);
  }else if(event.type==='flail')tone(140,.12,'square',.05);
  else if(event.type==='drop'){
    dropAt=now;world.dropCause=event.cause;
    gradePops=gradePops.filter(pop=>pop.hand!==event.hand);
    gradePops.push({hand:event.hand,text:event.cause==='early'?'Too early':'Too late',color:COLORS.bad,x:handX,y:handY-ballPixels(view)*2,at:now,size:24});
    tone(110,.35,'sine',.3,.5);
  }
}
let lastFrameMs=performance.now();
function frame(nowMs){
  const seconds=Math.min(SETTINGS.longestFrameSeconds,(nowMs-lastFrameMs)/1000),now=nowMs/1000;lastFrameMs=nowMs;
  if(mode!=='ready'){
    stepBacklog+=seconds;
    while(stepBacklog>=SETTINGS.simulationStepSeconds){step(world,SETTINGS.simulationStepSeconds);stepBacklog-=SETTINGS.simulationStepSeconds;}
    for(const event of world.events)handleEvent(event,now);
    world.events.length=0;
    gradePops=gradePops.filter(pop=>now-pop.at<SETTINGS.gradePopSeconds);catchRings=catchRings.filter(ring=>now-ring.at<SETTINGS.catchRingSeconds);
    world.balls.forEach((ball,index)=>{const trail=trails[index];if(ball.state==='air'){trail.push([ball.x,ball.y]);if(trail.length>SETTINGS.trailLength)trail.shift();}else trail.length=0;});
    if(mode==='play'&&world.droppedAt!==null&&world.time-world.droppedAt>SETTINGS.resultDelaySeconds)endRun();
  }
  render(nowMs);
  requestAnimationFrame(frame);
}

/* =====================================================================
   8. START
   ===================================================================== */
updateMuteButton();
loadLevel(Math.min(save.unlocked-1,LEVELS.length-1));
requestAnimationFrame(frame);
</script>
